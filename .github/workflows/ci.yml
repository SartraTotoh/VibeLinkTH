name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      DATABASE_URL_UNPOOLED: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      AUTH_SECRET: "ci-only-secret-ci-only-secret-ci-only"
      APP_URL: "http://localhost:3000"
      SHORT_LINK_URL: "http://localhost:3000/go"
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run check:charset
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_TEST_URL: "https://app.vibelinkth.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
