name: Deploy VibeLink production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vibelink-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      APP_URL: https://app.vibelinkth.com
      AUTH_SECRET: build-only-placeholder-not-used-in-production
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run check:charset
      - run: npm run check:security
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run cf:build
      - run: npm run test:e2e
      - name: Verify account and existing landing target before deploying
        id: targets
        run: node scripts/cloudflare-targets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy application Worker
        run: npx wrangler deploy --var "RELEASE_SHA:$RELEASE_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ github.sha }}
      - name: Deploy existing landing Pages project
        run: npx wrangler pages deploy landing --project-name "$PAGES_PROJECT" --branch "$PAGES_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.targets.outputs.pages_project }}
          PAGES_BRANCH: ${{ steps.targets.outputs.pages_branch }}
      - name: Verify legacy recipient CSV paths are not publicly accessible
        run: node scripts/check-public-pitch-exposure.mjs
      - name: Verify deployed release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://app.vibelinkth.com/api/health', { cache: 'no-store', signal: AbortSignal.timeout(15000) });
          const health = await response.json();
          if (!response.ok || !health.ok || health.release !== process.env.RELEASE_SHA) throw new Error('Production health/release does not match this commit.');
          const pitch = await fetch('https://vibelinkth.com/pitch', { signal: AbortSignal.timeout(15000) });
          if (!pitch.ok || new URL(pitch.url).origin !== 'https://app.vibelinkth.com' || !new URL(pitch.url).pathname.startsWith('/pitch')) throw new Error('Landing pitch destination did not resolve to the app feature.');
          console.log('Production release and public Pitch entry verified.');
          JS
